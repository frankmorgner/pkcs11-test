name: Release

on:
  push:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-2025
          - os: windows-11-arm
          # macOS
          - os: macos-26
          - os: macos-26-intel
          # Linux
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: pkcs11-test_${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/pkcs11-test
            target/release/pkcs11-test.exe
            src/test-cases
            README.md
      - &use_cache
        uses: actions/cache@v5
        id: cache-build
        with:
          path: ./*
          key: ${{ matrix.os }}-${{ github.sha }}

  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-2025
          - os: windows-11-arm
          # macOS
          - os: macos-26
          - os: macos-26-intel
          # Linux
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
    needs: [build, test]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/cache@v5
        id: cache-build
        with:
          path: ./*
          key: ${{ matrix.os }}-${{ github.sha }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS
          - os: macos-26
            softhsm: /opt/homebrew/Cellar/softhsm/*/lib/softhsm/libsofthsm2.so
          - os: macos-26-intel
            softhsm: /usr/local/Cellar/softhsm/*/lib/softhsm/libsofthsm2.so
          # Linux
          - os: ubuntu-24.04
            softhsm: /usr/lib/softhsm/libsofthsm2.so
          - os: ubuntu-24.04-arm
            softhsm: /usr/lib/softhsm/libsofthsm2.so
    runs-on: ${{ matrix.os }}
    needs: [build]
    steps:
      - uses: actions/cache@v5
        id: cache-build
        with:
          path: ./*
          key: ${{ matrix.os }}-${{ github.sha }}
      - if: runner.os == 'macOS'
        run: brew install softhsm
      - if: runner.os == 'Linux'
        run: sudo apt-get install softhsm2
      - run: find / 2>/dev/null | grep libsofthsm2.so
      - run: target/release/pkcs11-test --module ${{ matrix.softhsm }} src/test-cases/pkcs11-v3.1/softhsm-2.6.1/init.xml
      - run: target/release/pkcs11-test --module ${{ matrix.softhsm }} src/test-cases/pkcs11-v3.1/softhsm-2.6.1/AUTH-M-1-31.xml src/test-cases/pkcs11-v3.1/softhsm-2.6.1/BL-M-1-31.xml src/test-cases/pkcs11-v3.1/softhsm-2.6.1/CERT-M-1-31.xml src/test-cases/pkcs11-v3.1/softhsm-2.6.1/EXT-M-1-31.xml
      - run: cat src/test-cases/pkcs11-v3.2/softhsm-2.6.1/AUTH-M-1-32.xml src/test-cases/pkcs11-v3.2/softhsm-2.6.1/BL-M-1-32.xml src/test-cases/pkcs11-v3.2/softhsm-2.6.1/CERT-M-1-32.xml src/test-cases/pkcs11-v3.2/softhsm-2.6.1/EXT-M-1-32.xml | target/release/pkcs11-test --module ${{ matrix.softhsm }}
